<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="gradHomiq" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0A0F1D" flood-opacity="0.25" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Square -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#gradHomiq)" filter="url(#shadow)" />
  
