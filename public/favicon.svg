    <rect x="40" y="54" width="4" height="6" rx="1" fill="#2563EB" />
    <rect x="48" y="54" width="4" height="6" rx="1" fill="#2563EB" />
    <rect x="40" y="66" width="4" height="6" rx="1" fill="#2563EB" />
    <rect x="48" y="66" width="4" height="6" rx="1" fill="#2563EB" />
    <rect x="40" y="78" width="4" height="6" rx="1" fill="#2563EB" />
    <rect x="48" y="78" width="4" height="6" rx="1" fill="#2563EB" />

    <!-- Center High Tower -->
    <rect x="60" y="30" width="34" height="68" rx="4" />
    <polygon points="77,20 60,32 94,32" />
    
    <rect x="68" y="40" width="6" height="8" rx="1.5" fill="#1D4ED8" />
    <rect x="80" y="40" width="6" height="8" rx="1.5" fill="#1D4ED8" />
    <rect x="68" y="54" width="6" height="8" rx="1.5" fill="#1D4ED8" />
    <rect x="80" y="54" width="6" height="8" rx="1.5" fill="#1D4ED8" />
    <rect x="68" y="68" width="6" height="8" rx="1.5" fill="#1D4ED8" />
    <rect x="80" y="68" width="6" height="8" rx="1.5" fill="#1D4ED8" />
    <rect x="73" y="84" width="8" height="14" rx="2" fill="#1D4ED8" />
